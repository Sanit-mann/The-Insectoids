packages:
  - apps/*
  - packages/*

# Only these dependencies may run install scripts (Electron downloads its binary; esbuild its platform build).
allowBuilds:
  electron: true
  esbuild: true
  # protobufjs (via onnxruntime-web) only prints a version-scheme warning on install; not needed.
  protobufjs: false
  # electron-winstaller (via electron-builder) is for Squirrel installers; the app ships NSIS, so its script isn't needed.
  electron-winstaller: false

# Supply chain (the user's rule): a newly resolved package, direct or indirect, must be at least 14 days old.
minimumReleaseAge: 20160
# Already locked before the rule was added (2026-11-14) and younger than 14 days that day; the user chose to keep
# exactly these versions (they include other platforms builds, checked by CI). Drop each line once it is 14 days
# old. Anything newly resolved must pass the rule.
minimumReleaseAgeExclude:
  - '@babel/core@7.29.13'
  - '@babel/generator@7.29.13'
  - '@babel/helper-compilation-targets@7.29.13'
  - '@babel/helper-module-transforms@7.29.13'
  - '@babel/helper-string-parser@7.29.13'
  - '@babel/helpers@7.29.13'
  - '@babel/parser@7.29.13'
  - '@babel/traverse@7.29.13'
  - '@eslint-community/regexpp@4.12.3'
  - '@hono/node-server@2.1.7'
  - '@playwright/test@1.65.0'

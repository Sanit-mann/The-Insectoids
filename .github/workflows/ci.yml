name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm (version pinned in package.json)
        run: corepack enable pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: End-to-end tests (Linux, virtual display)
        if: runner.os == 'Linux'
        # The Vault only stores keys the OS can encrypt, and a bare runner has no key store, so start an unlocked
        # GNOME keyring (a throwaway, CI-only password) on a private session bus for the tests.
        env:
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gnome-keyring dbus-x11
          dbus-run-session -- bash -c 'echo -n "ci-only" | gnome-keyring-daemon --unlock --components=secrets > /dev/null && xvfb-run --auto-servernum pnpm test:e2e'

      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: apps/desktop/playwright-report
          if-no-files-found: ignore
